function isDarkMode() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark') return true;
  if (t === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}
const isDark = isDarkMode();
const grayColor = getComputedStyle(document.documentElement).getPropertyValue('--gray').trim();

const svg = d3.select('#map').append('svg').attr('viewBox', '0 0 680 640');
const projection = d3.geoMercator();
const path = d3.geoPath(projection);
projection.fitExtent([[14,14],[666,626]], data);

const colorScale = d3.scaleSequential(d3.interpolateRgbBasis(
  isDark ? ['#3d3a1f','#8a5a2a','#c2542f','#7a2f52','#3d1f4d'] : ['#fef4c8','#f7ad5c','#e0653f','#a13a63','#3f2166']
)).domain([6, 22]);

const tip = d3.select('#tip');
let field = 'a';
function fillFor(d) { const v = d.properties[field]; return v === undefined ? grayColor : colorScale(v); }

const paths = svg.selectAll('path').data(data.features).join('path')
  .attr('d', path)
  .attr('fill', fillFor)
  .attr('stroke', isDark ? '#0e0d0c' : '#ffffff')
  .attr('stroke-width', 0.5)
  .style('cursor', 'default')
  .on('mousemove', function(event, d) {
    const v = d.properties[field];
    const label = field === 'a' ? 'volwassenen' : '65-plussers';
    const html = v === undefined
      ? '<strong>' + d.properties.buurtnaam + '</strong><br>' + d.properties.gemeentenaam + '<br>Geen betrouwbare schatting'
      : '<strong>' + d.properties.buurtnaam + '</strong><br>' + d.properties.gemeentenaam + '<br>' + v + '% sterk eenzame ' + label;
    tip.style('display', 'block').html(html)
      .style('left', (event.clientX + 14) + 'px')
      .style('top', (event.clientY + 14) + 'px');
  })
  .on('mouseleave', () => tip.style('display', 'none'));

document.getElementById('ageToggle').addEventListener('change', (e) => {
  field = e.target.value;
  paths.transition().duration(300).attr('fill', fillFor);
});

const legendVals = [6, 10, 14, 18, 22];
const legend = d3.select('#legend');
legend.append('span').text('weinig');
legendVals.forEach(v => {
  legend.append('span').attr('class','swatch').style('background', colorScale(v));
});
legend.append('span').text('veel');
const grayItem = legend.append('span');
grayItem.append('span').attr('class','swatch').style('background', grayColor).style('margin-left','12px').style('margin-right','4px');
grayItem.append('span').text('Geen betrouwbare schatting');
</script>
